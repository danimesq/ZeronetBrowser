name: Windows build

on:
  push:
    branches: [master, "fix-*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Check out repository and ZeroNet submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.7.17"
          architecture: x64
          cache: pip

      - name: Install Python build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade "pip<24.1" "setuptools<68" wheel
          python -m pip install pyinstaller==5.13.2 msgpack gevent pypiwin32 PyQt5-sip PyQt5==5.12.3 PyQtWebEngine==5.12.1

      - name: Install ZeroNet dependencies
        shell: pwsh
        run: |
          python -m pip install -r ZeroNet/requirements.txt

      - name: Run first-start regression test
        shell: pwsh
        run: |
          python -m unittest test.first_run_test -v

      - name: Build Windows application
        shell: pwsh
        run: |
          python -m PyInstaller --clean browser.spec
